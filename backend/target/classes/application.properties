
# Use H2 in-memory database for local development to avoid Postgres setup.
spring.datasource.url=jdbc:h2:mem:footcare;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=ReplaceThisWithASecretKeyForJWTSigning
jwt.expiration=86400000

# Cloudinary (set in environment or here)
cloudinary.cloud_name=
cloudinary.api_key=
cloudinary.api_secret=

# To use Postgres instead, set the following environment variables or uncomment and edit:
# spring.datasource.url=jdbc:postgresql://localhost:5432/footcare
# spring.datasource.username=postgres
# spring.datasource.password=yourpassword
